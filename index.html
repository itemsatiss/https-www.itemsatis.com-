<script>
(function(){
  const card=document.querySelector('.hero-card');
  let img=document.querySelector('.hero-img');
  const button=document.querySelector('.hero-buy');
  const dotsBox=document.querySelector('.slider-dots');
  if(!card||!img||!button||!dotsBox)return;
  card.classList.add('itemsatis-carousel-ready');
  const slides=[
  ['banner-1-original.jpg','Roblox','Alışverişe Başla'],
  ['banner-2-original.jpg','PUBG Spider-Man','Hemen UC Satın Al'],
  ['banner-3-original.jpg','Clash of Clans','Alışverişe Başla'],
  ['banner-4-original.jpg','eFootball Messi','Alışverişe Başla'],
  ['banner-5-original.jpg','Car Parking Multiplayer','Alışverişe Başla'],
  ['banner-6-original.jpg','Mobile Legends','Alışverişe Başla'],
  ['banner-7-original.jpg','Genshin Impact','Alışverişe Başla'],
  ['banner-8-original.jpg','Valorant','Hemen VP Satın Al'],
  ['banner-9-original.jpg','Steam','Hemen Satın Al']
];
  let current=0;
  let timer;
  dotsBox.innerHTML=slides.map((_,i)=>
    '<i data-slide="'+i+'" class="'+(i===0?'on':'')+'"></i>'
  ).join('');
  const dots=dotsBox.querySelectorAll('i');
function showSlide(n){
  const next=(n+slides.length)%slides.length;
  if(next===current)return;

  const direction =
    (next>current || (current===slides.length-1 && next===0))
    ? 1 : -1;

  const oldImg=img;
  const newImg=document.createElement('img');

  newImg.src=slides[next][0];
  newImg.alt=slides[next][1];
  newImg.className='hero-img';

  newImg.style.cssText=`
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    transform:translateX(${direction*100}%);
    transition:none;
    z-index:2;
  `;

  oldImg.style.transition='none';
  oldImg.style.transform='translateX(0)';
  oldImg.style.position='relative';
  oldImg.style.zIndex='1';

  card.appendChild(newImg);

  newImg.offsetWidth;

  requestAnimationFrame(()=>{
    newImg.style.transition=
      'transform 500ms cubic-bezier(.25,.8,.25,1)';
    oldImg.style.transition=
      'transform 500ms cubic-bezier(.25,.8,.25,1)';

    newImg.style.transform='translateX(0)';
    oldImg.style.transform=
      `translateX(${-direction*100}%)`;
  });

  setTimeout(()=>{
    oldImg.remove();

    newImg.style.position='';
    newImg.style.inset='';
    newImg.style.height='';
    newImg.style.transform='';
    newImg.style.transition='';
    newImg.style.zIndex='';
  },520);

  current=next;
img=newImg;
  const span=button.querySelector('span');
  if(span)span.textContent=slides[current][2];

  dots.forEach((d,i)=>
    d.classList.toggle('on',i===current)
  );
}
  function start(){
    clearInterval(timer);
    timer=setInterval(()=>showSlide(current+1),4000);
  }
  dots.forEach(d=>{
    d.onclick=()=>{
      showSlide(Number(d.dataset.slide));
      start();
    };
  });
  let startX=0;
  card.addEventListener('touchstart',e=>{
    startX=e.touches[0].clientX;
  },{passive:true});
  card.addEventListener('touchend',e=>{
    const diff=startX-e.changedTouches[0].clientX;
    if(Math.abs(diff)>45){
      showSlide(current+(diff>0?1:-1));
      start();
    }
  },{passive:true});
  showSlide(0);
  start();
})();
</script>
